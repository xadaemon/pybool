[project]
name = "pybool"
version = "1.0.0"
description = "Boolean algebra and hdl facilities for python"
authors = [
    {name = "Matheus Xavier",email = "mxavierdev@gmail.com"}
]
license = {text = "LGPL"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "pytest (>=8.4.2,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tools.pytest.ini_options]
pythonpath = [
    "."
]
